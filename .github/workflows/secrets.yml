name: secret scan

# GitHub's free secret scanning matches **provider** patterns - AWS `AKIA...`,
# GitHub `ghp_...`, Stripe `sk_live_...`. A generic `KEY = "value"` assignment is
# not one of those, and the detector for that class
# (`secret_scanning_non_provider_patterns`) is part of paid Secret Protection: on
# a free account the API accepts the setting and silently leaves it disabled.
#
# That is the gap this workflow closes. It is a separate workflow, and carries a
# separate badge, on purpose: `verify claims` answers "are the claims still
# true?", and this answers "is anything leaked?". Folding them together would let
# a leak be read as a false claim, or a false claim hide behind a clean scan.

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:15 UTC - just after the claims check. A credential can be
    # committed to any repository in the account without anything being pushed
    # here, so a weekly run is the actual safety net.
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # First, prove the detector fires. The failure this guards against is a
      # scanner that reports "clean" because it is broken - the self-test feeds it
      # the exact shape of the original leak and requires a hit, and feeds it
      # placeholders and requires silence. A guard that cannot be shown to fire is
      # not a guard.
      - name: The detector fires on the real leak shape and stays silent on placeholders
        run: python3 check_secrets.py --self-test

      # REPUTATION_TOKEN is a fine-grained PAT with read access to the account's
      # public repositories. The workflow's own GITHUB_TOKEN is scoped to this
      # repository alone, so it cannot enumerate the rest of the account - and the
      # one real finding lived in a different repository. Without the secret the
      # scan reads too little and fails on the coverage floor rather than
      # reporting a clean account.
      - name: Scan every owned public repository for committed credentials
        env:
          GH_TOKEN: ${{ secrets.REPUTATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 check_secrets.py
