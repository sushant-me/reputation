name: verify claims

# Re-checks every claim in evidence.json against the source it names. A claim
# that stops being true turns this red, so the badge on the README is a live
# statement about whether the claims below it still hold.

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC: a leaderboard position or a pull-request state can
    # change while nothing is pushed here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `check_surfaces.py` reads the pages a reader actually reaches, and three of
      # them live in other repositories. Checking them out here is what gives that
      # step real coverage; `--min-surfaces 4` then makes a run that found nothing to
      # read fail instead of passing, which is the failure mode it exists to catch.
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/sushant-me
          path: profile-readme
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/hire
          path: hire
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/Portfolio
          path: portfolio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checks read public sources over the unauthenticated GitHub API, so
      # this job needs no credentials. GH_TOKEN is passed only so the script can
      # fall back to `gh` if the anonymous hourly limit is hit.
      - name: Verify every claim against its source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 verify_evidence.py

      # The CVs and job-kit are not repositories, so this step covers what is
      # reachable from CI: the profile, the hire page, the portfolio source and the
      # evidence sheet. Running it with --require-all on the workstation covers the
      # rest.
      - name: Check the public surfaces for stale or wrong claims
        env:
          # The release-link check asks GitHub for each repository's latest release;
          # unauthenticated `gh` on a runner has no token, so it is passed here too.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check_surfaces.py --min-surfaces 4
