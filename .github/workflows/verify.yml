name: verify claims

# Re-checks every claim in evidence.json against the source it names. A claim
# that stops being true turns this red, so the badge on the README is a live
# statement about whether the claims below it still hold.

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC: a leaderboard position or a pull-request state can
    # change while nothing is pushed here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Every repository is checked out into a subdirectory, including this one, so
      # the layout matches the workstation: one parent holding `reputation/`,
      # `profile-readme/`, `hire/` and `portfolio/`. `check_surfaces.py` resolves its
      # surfaces relative to that parent. The first version of this job checked this
      # repository out at the root instead, so the script looked one level too high,
      # found a single surface, and the run failed - which is how the mistake was
      # caught rather than passing quietly.
      - uses: actions/checkout@v5
        with:
          path: reputation
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/sushant-me
          path: profile-readme
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/hire
          path: hire
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/Portfolio
          path: portfolio

      # The project READMEs are claims surfaces too - rule counts, test counts,
      # measured percentages - so they are checked rather than assumed.
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/agentbound
          path: agentbound
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/mcpaudit
          path: mcpaudit
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/policygate
          path: policygate
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/mcp-nameguard
          path: mcp-nameguard
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/trajectorycheck
          path: trajectorycheck
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/tool-boundary-corpus
          path: tool-boundary-corpus

      # The posts, the work sample and the paper's own documents make public claims
      # too - the benchmark post states precision and recall, the review sample
      # asserts four findings reproduce, and the paper README carries the measured
      # numbers. They were not scanned because the list was written by hand.
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/writeups
          path: writeups
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/agent-review-sample
          path: agent-review-sample
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/mcp-audit-sample
          path: mcp-audit-sample
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/Edge-Native_Semantic_Firewall_
          path: Edge-Native_Semantic_Firewall_

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checks read public sources over the unauthenticated GitHub API, so
      # this job needs no credentials. GH_TOKEN is passed only so the scripts can
      # fall back to `gh` if the anonymous hourly limit is hit.
      - name: Verify every claim against its source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 reputation/verify_evidence.py

      # The CVs and job-kit are not repositories, so this step covers what is
      # reachable from CI: the profile, the hire page, the portfolio source, the
      # evidence sheet and the six project READMEs. Running it with --require-all
      # on the workstation adds the CVs, job-kit and everything else. The
      # --min-surfaces floor makes a run that found nothing to read fail.
      # pdftotext is what makes a PDF surface readable at all. It ships on the
      # ubuntu-latest image, which is exactly why the dependency was never stated: if it
      # were ever absent, every PDF assertion would have passed on an empty string rather
      # than failed. Installed explicitly now, and check_surfaces.py fails when a PDF
      # produces no text instead of reporting a clean result for a document nothing read.
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check the public surfaces for stale or wrong claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 reputation/check_surfaces.py --min-surfaces 22

      # Dead links rot silently. Two were found on the portfolio by hand: one to a
      # repository that is private, so it 404'd for every visitor, and one with a
      # phrase pasted into the URL. Nothing was watching either of them. This fails
      # the run on 404/410 and on malformed URLs, and deliberately does NOT fail on
      # 403/429 - a host declining automated clients says nothing about whether a
      # reader can reach the page, and a check that cries wolf gets switched off.
      - name: Check that every external link on the pages and READMEs resolves
        run: python3 reputation/check_links.py

      # A link that resolves is not the same as a row that exists. The writeups
      # index listed six posts while nine existed - both posts from 2026-09-23
      # among the missing, and every link in the table resolved the entire time,
      # so check_links.py could not see it. This compares the directory to the
      # table instead of reading the table on its own.
      - name: Check that every post is listed in the writeups index
        run: python3 reputation/check_writeups_index.py

      # Same discipline as the other guards here: the failure mode is silence, so
      # the check is fed a partial index and required to go red, and a complete one
      # and required to stay quiet. A guard that cannot be shown to fire is not a
      # guard.
      - name: The writeups-index guard fires on a partial index
        run: python3 reputation/check_writeups_index.py --self-test

      # The guard on an unreadable PDF is only worth having if it fires, and the failure
      # mode it was written for is silence: an empty read made every PDF assertion pass.
      # So the guard is mutation-tested here - hide pdftotext behind a command that fails,
      # and require the checker to go red. If it passes, the guard has gone quiet again and
      # that would otherwise look exactly like every document being up to date.
      - name: The unreadable-PDF guard fires
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nexit 1\n' > /tmp/fakebin/pdftotext
          chmod +x /tmp/fakebin/pdftotext
          if PATH="/tmp/fakebin:$PATH" python3 reputation/check_surfaces.py --min-surfaces 22; then
            echo "::error::a PDF that could not be read was accepted; the guard is not firing"
            exit 1
          fi
          echo "unreadable PDF is reported, not skipped: ok"

      # The same discipline for the rule-count guard. A count that agrees with the
      # source today says nothing about whether it would disagree tomorrow, and this
      # claim spent a release saying "five rules" against nine registered ones while
      # its verification only checked that the repository existed. So the claim is
      # mutated back to the value that was actually published, and the check must
      # reject it. If it passes, the number has gone decorative again.
      - name: The rule-count guard fires
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import copy, json, sys
          sys.path.insert(0, "reputation")
          import verify_evidence as v

          claims = json.load(open("reputation/evidence.json", encoding="utf-8"))["claims"]
          claim = next(c for c in claims if c.get("id") == "tool-agentbound")
          stale = copy.deepcopy(claim)
          stale["verification"]["expect"]["registered_rules"] = 5  # the published value
          status, note = v.check_agentbound_rule_count(stale)
          if status == v.PASS:
              print("::error::a stale rule count was accepted; the guard is not firing")
              sys.exit(1)
          print(f"stale rule count rejected, as required: {note}")
          PYEOF
