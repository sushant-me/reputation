name: verify claims

# Re-checks every claim in evidence.json against the source it names. A claim
# that stops being true turns this red, so the badge on the README is a live
# statement about whether the claims below it still hold.

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC: a leaderboard position or a pull-request state can
    # change while nothing is pushed here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Every repository is checked out into a subdirectory, including this one, so
      # the layout matches the workstation: one parent holding `reputation/`,
      # `profile-readme/`, `hire/` and `portfolio/`. `check_surfaces.py` resolves its
      # surfaces relative to that parent. The first version of this job checked this
      # repository out at the root instead, so the script looked one level too high,
      # found a single surface, and the run failed - which is how the mistake was
      # caught rather than passing quietly.
      - uses: actions/checkout@v5
        with:
          path: reputation
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/sushant-me
          path: profile-readme
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/hire
          path: hire
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/Portfolio
          path: portfolio

      # The project READMEs are claims surfaces too - rule counts, test counts,
      # measured percentages - so they are checked rather than assumed.
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/agentbound
          path: agentbound
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/mcpaudit
          path: mcpaudit
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/policygate
          path: policygate
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/mcp-nameguard
          path: mcp-nameguard
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/trajectorycheck
          path: trajectorycheck
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/tool-boundary-corpus
          path: tool-boundary-corpus

      # The posts, the work sample and the paper's own documents make public claims
      # too - the benchmark post states precision and recall, the review sample
      # asserts four findings reproduce, and the paper README carries the measured
      # numbers. They were not scanned because the list was written by hand.
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/writeups
          path: writeups
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/agent-review-sample
          path: agent-review-sample
      - uses: actions/checkout@v5
        with:
          repository: sushant-me/Edge-Native_Semantic_Firewall_
          path: Edge-Native_Semantic_Firewall_

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checks read public sources over the unauthenticated GitHub API, so
      # this job needs no credentials. GH_TOKEN is passed only so the scripts can
      # fall back to `gh` if the anonymous hourly limit is hit.
      - name: Verify every claim against its source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 reputation/verify_evidence.py

      # The CVs and job-kit are not repositories, so this step covers what is
      # reachable from CI: the profile, the hire page, the portfolio source, the
      # evidence sheet and the six project READMEs. Running it with --require-all
      # on the workstation adds the CVs, job-kit and everything else. The
      # --min-surfaces floor makes a run that found nothing to read fail.
      - name: Check the public surfaces for stale or wrong claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 reputation/check_surfaces.py --min-surfaces 21
